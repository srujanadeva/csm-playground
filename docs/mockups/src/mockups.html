<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSM Playground — mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed spruce sidebar + top bar + scrolling work area; forms in titled panels, dense tables. */
:root{
  --ink:#15201E; --muted:#5B6967; --faint:#8A9794; --line:#D9E1DF; --line-strong:#C3CECB;
  --bg:#EEF2F1; --surface:#FFFFFF; --sunken:#F6F8F8;
  --side:#0F2D2A; --side-2:#163A36; --side-fg:#BFD3CE; --side-dim:#7E9B95;
  --accent:#0D7564; --accent-ink:#095A4D; --accent-weak:#E2F1EE;
  --brass:#B4862C; --brass-weak:#F7EEDB;
  --ok:#1E7F45; --ok-weak:#E3F3E8; --warn:#A86A12; --warn-weak:#FBF0DC;
  --bad:#B42318; --bad-weak:#FDE8E6; --info:#2560A0; --info-weak:#E5EEF8;
  --sans:"IBM Plex Sans","Noto Sans Kannada",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ── shell ── */
.app{display:grid;grid-template-columns:248px 1fr;min-height:900px}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--side-2);margin-bottom:12px}
.mark{width:32px;height:32px;border-radius:7px;background:var(--brass);display:grid;place-items:center;color:#2A1D05;font-weight:700;font-size:13px;letter-spacing:.02em}
.brand b{display:block;color:#fff;font-size:14px;font-weight:600}
.brand span{font-size:11px;color:var(--side-dim);letter-spacing:.06em;text-transform:uppercase}
.navg{margin:10px 0 4px;padding:0 10px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-dim);display:flex;justify-content:space-between}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-size:13.5px}
.nav a.sub{padding-inline-start:36px;font-size:13px}
.nav a.on{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 var(--brass)}
.nav a .cnt{margin-inline-start:auto;background:#24504A;color:#E3EFEC;font-size:11px;padding:1px 7px;border-radius:10px}
.side-foot{margin-top:auto;border-top:1px solid var(--side-2);padding:12px 8px 0;font-size:12px;color:var(--side-dim)}
.side-foot b{color:#E6F0EE;font-weight:500;display:block;font-size:13px}
.main{display:flex;flex-direction:column;min-width:0}
.top{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.crumb b{color:var(--ink);font-weight:600}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted);background:var(--sunken)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-weak);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px}
.who{font-size:12.5px;line-height:1.2}
.who b{display:block;font-weight:600;font-size:13px}
.who span{color:var(--muted)}
.work{padding:22px 28px 32px;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-end;gap:12px}
.ph h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ph .grow{flex:1}

/* ── controls ── */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 13px var(--sans);white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:#EBC1BC}
.btn.dis{opacity:.45}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel>header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.panel>header h2{margin:0;font-size:14px;font-weight:600}
.panel>header .hint{color:var(--muted);font-size:12.5px}
.panel>.body{padding:16px 18px}
.grid{display:grid;gap:14px 18px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2} .span3{grid-column:span 3} .span4{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.req::after{content:" *";color:var(--bad)}
.in{height:36px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:0 11px;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);min-width:0}
.in.ph-t{color:var(--faint)}
.in.sel::after{content:"";margin-inline-start:auto;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-2px) rotate(45deg)}
.in.err{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-weak)}
.in.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.in.ro{background:var(--sunken);color:var(--muted)}
.in .tail{margin-inline-start:auto;color:var(--muted);display:flex}
.in.ta{height:auto;min-height:74px;align-items:flex-start;padding:9px 11px}
.errmsg{font-size:12px;color:var(--bad)}
.help{font-size:12px;color:var(--faint)}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px;min-height:36px;align-items:center}
.rb,.cb{display:inline-flex;align-items:center;gap:7px;font-size:13.5px}
.rb i{width:16px;height:16px;border-radius:50%;border:1.6px solid var(--line-strong);background:var(--surface);display:inline-block}
.rb.on i{border:5px solid var(--accent)}
.cb i{width:16px;height:16px;border-radius:4px;border:1.6px solid var(--line-strong);background:var(--surface);display:inline-grid;place-items:center}
.cb.on i{background:var(--accent);border-color:var(--accent)}
.cb.on i::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.toggle{width:34px;height:20px;border-radius:10px;background:var(--line-strong);position:relative;display:inline-block}
.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent)}
.toggle.on::after{inset-inline-start:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--line-strong);border-radius:999px;padding:5px 12px;font-size:12.5px;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.tag.on{background:var(--accent-weak);border-color:#9CCFC4;color:var(--accent-ink);font-weight:500}
.slider{display:flex;align-items:center;gap:14px;height:36px}
.slider .track{flex:1;height:4px;background:var(--line);border-radius:2px;position:relative}
.slider .track b{position:absolute;inset-block:0;inset-inline-start:0;width:38%;background:var(--accent);border-radius:2px}
.slider .track i{position:absolute;top:50%;inset-inline-start:38%;width:18px;height:18px;margin:-9px -9px 0;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.slider .val{font-weight:600;min-width:96px;text-align:end}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px 2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-weak);color:var(--ok)} .pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.bad{background:var(--bad-weak);color:var(--bad)} .pill.info{background:var(--info-weak);color:var(--info)}
.pill.mute{background:var(--sunken);color:var(--muted);border:1px solid var(--line)}
.prio{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.prio.c{background:var(--bad);color:#fff} .prio.h{background:var(--bad-weak);color:var(--bad)} .prio.m{background:var(--warn-weak);color:var(--warn)} .prio.l{background:var(--sunken);color:var(--muted)}

/* table */
.tw{overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:start;padding:10px 14px;background:var(--sunken);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr.sel td{background:#F2F9F7}
tr:last-child td{border-bottom:0}
th .sort{color:var(--accent)}
.kebab{color:var(--muted);letter-spacing:1px;font-weight:700}
.tfoot{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pager{display:flex;gap:4px;margin-inline-start:auto}
.pager span{min-width:30px;height:30px;border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:12.5px;color:var(--ink);padding:0 6px;background:var(--surface)}
.pager span.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.pager span.gap{border:0;background:none;color:var(--muted)}

/* stepper */
.steps{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step{flex:1;display:flex;gap:10px;align-items:center;padding:12px 16px;border-inline-end:1px solid var(--line);font-size:13px;color:var(--muted)}
.step:last-child{border-inline-end:0}
.step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.step.done .n{background:var(--accent);border-color:var(--accent);color:#fff}
.step.cur{color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent)}
.step.cur .n{border-color:var(--accent);color:var(--accent)}
.step small{display:block;font-weight:400;color:var(--faint);font-size:11.5px}
.actions{display:flex;gap:10px;align-items:center}
.actions .grow{flex:1}
.saved{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 18px}
.tabs span{padding:11px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tabs span.on{color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tabs .c{font-size:11px;background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:0 6px;color:var(--muted)}

/* misc */
.dz{border:1.5px dashed var(--line-strong);border-radius:8px;background:var(--sunken);padding:16px;display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px}
.dz b{color:var(--accent-ink)}
.files{display:flex;gap:10px;flex-wrap:wrap}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);font-size:12.5px;min-width:220px}
.thumb{width:40px;height:30px;border-radius:4px;background:linear-gradient(135deg,#d9e6e3,#b9cfca);position:relative;overflow:hidden}
.thumb::after{content:"";position:absolute;left:5px;top:6px;width:10px;height:12px;border-radius:2px;background:#8FAEA8}
.thumb::before{content:"";position:absolute;left:19px;right:5px;top:8px;height:2px;background:#8FAEA8;box-shadow:0 5px 0 #8FAEA8,0 10px 0 #a9c2bd}
.file .meta{color:var(--faint);font-size:11.5px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.bar b{display:block;height:100%;width:64%;background:var(--accent)}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:6px;font-size:13px}
.note.warn{background:var(--warn-weak);color:#6E4508} .note.info{background:var(--info-weak);color:#1D4A7C} .note.bad{background:var(--bad-weak);color:#7D1810}
.reveal{border-inline-start:3px solid var(--brass);background:var(--brass-weak);padding:12px 14px;border-radius:0 6px 6px 0}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 24px}
.kv div span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.kv div b{font-weight:500}
.toast{position:absolute;bottom:24px;inset-inline-end:28px;background:var(--ink);color:#fff;border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:13px;box-shadow:0 10px 30px rgba(10,30,28,.25)}
.toast .ok{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.tip{position:absolute;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:6px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ink)}
.menu{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(10,30,28,.16);padding:6px;min-width:190px;font-size:13px}
.menu div{padding:7px 10px;border-radius:5px;display:flex;gap:8px;align-items:center}
.menu div.hl{background:var(--accent-weak);color:var(--accent-ink)}
.menu div.dis{color:var(--faint)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.scrim{position:absolute;inset:0;background:rgba(12,28,26,.38)}
.drawer{position:absolute;top:0;bottom:0;inset-inline-end:0;width:560px;background:var(--surface);box-shadow:-20px 0 40px rgba(10,30,28,.18);display:flex;flex-direction:column}
.drawer>header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.drawer>header h2{margin:0;font-size:16px}
.drawer .x{margin-inline-start:auto;color:var(--muted);font-size:18px}
.drawer .db{padding:18px 22px;display:flex;flex-direction:column;gap:16px;overflow:hidden;flex:1}
.drawer>footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:460px;background:var(--surface);border-radius:10px;box-shadow:0 24px 60px rgba(10,30,28,.3)}
.modal header{padding:16px 20px 0;font-weight:600;font-size:16px}
.modal .mb{padding:10px 20px 16px;display:flex;flex-direction:column;gap:12px;color:var(--muted)}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--sunken);border-radius:0 0 10px 10px}
.rel{position:relative}
.matrix td,.matrix th{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:start}
.matrix .inh i{background:var(--line);border-color:var(--line-strong)}
.matrix .inh.on i{background:#9FBFB8;border-color:#9FBFB8}
.ovr{font-size:10px;font-weight:700;color:var(--brass);margin-inline-start:3px;vertical-align:top}
.na{color:var(--line-strong)}
.drag{color:var(--faint);letter-spacing:-2px;font-weight:700}

/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.col{background:#E5EBEA;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col h3{margin:0 0 2px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:center;color:var(--muted);padding:2px 4px}
.col h3 .c{background:var(--surface);border-radius:9px;padding:0 7px;color:var(--ink);font-size:11.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.card .t{font-weight:600;font-size:13px}
.card .r{display:flex;gap:8px;align-items:center;color:var(--muted)}
.card .r .grow{flex:1}
.card.lift{transform:rotate(-2deg);box-shadow:0 14px 30px rgba(10,30,28,.22);border-color:var(--accent)}
.card.ghost{border:1.5px dashed var(--accent);background:var(--accent-weak);min-height:74px}
.sla{font-size:11.5px;display:inline-flex;gap:4px;align-items:center}
.sla.late{color:var(--bad);font-weight:600}
.more{text-align:center;font-size:12px;color:var(--muted);padding:6px;display:flex;gap:6px;justify-content:center;align-items:center}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent)}
.comment{display:flex;gap:10px;font-size:13px}
.comment .avatar{width:26px;height:26px;font-size:10.5px}
.comment p{margin:2px 0 0;color:var(--ink)}
.comment small{color:var(--faint)}

/* login */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:900px}
.lside{background:var(--side);color:var(--side-fg);padding:56px 64px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lside h1{color:#fff;font-size:34px;line-height:1.15;font-weight:600;margin:auto 0 14px;max-width:440px;letter-spacing:-.015em}
.lside p{max-width:420px;margin:0;color:var(--side-fg);font-size:15px}
.lside .ledger{position:absolute;inset-inline-end:-40px;top:120px;width:360px;opacity:.13;font-family:var(--mono);font-size:12px;line-height:2;color:#fff;white-space:pre}
.lside .foot{margin-top:40px;display:flex;gap:18px;font-size:12px;color:var(--side-dim)}
.lform{display:grid;place-items:center;background:var(--bg)}
.lcard{width:400px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px 32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 2px 6px rgba(10,30,28,.05)}
.lcard h2{margin:0;font-size:20px}
.lcard .sub{margin:-10px 0 0;color:var(--muted);font-size:13px}
.link{color:var(--accent-ink);font-weight:500}
.lang{display:flex;gap:4px;justify-content:center;font-size:12.5px;color:var(--muted)}
.lang b{color:var(--ink)}

/* mobile */
.m-app{width:390px;min-height:844px;background:var(--bg)}
.m-top{height:56px;background:var(--side);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}
.m-top b{font-size:15px;font-weight:600}
.m-work{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.m-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.m-card .r{display:flex;gap:8px;align-items:center}
.m-card .r .grow{flex:1}
</style>
</head>
<body>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search)
const S = P.get('s') || 'login'
const KN = P.get('lang') === 'kn'
if (KN) document.documentElement.lang = 'kn'

const ICONS = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  userplus:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M19 8v6M16 11h6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>',

    <div style="display:flex;gap:8px"><span class="chip">${ic('filter')}Status: Active</span><span class="chip">KYC: All</span></div>
    <div class="help"><b style="color:var(--ink)">3 customers</b> · mobile starts with +91 9</div>
    ${CUST.filter((_,i)=>[0,2,5].includes(i)).map(c=>`<div class="m-card"><div class="r"><span class="mono">${c[0]}</span><div class="grow"></div><span class="pill ${c[3]}">${c[4]}</span></div>

screens.m_onboard = () => `<div class="m-app">
  <div class="m-top">${ic('menu')}<b>Onboard customer</b><div style="flex:1"></div><span style="font-size:12px;color:var(--side-fg)">1 / 4</span></div>
  <div style="height:4px;background:var(--line)"><div style="width:25%;height:100%;background:var(--brass)"></div></div>
  <div class="m-work">
    <div class="f"><label class="req">Customer type</label><div class="opts">${rb('Individual',1)}${rb('Corporate')}</div></div>
    ${field('Title','Ms',{sel:1})}
    ${field('First name','Ananya',{req:1})}
    ${field('Last name','',{req:1,err:'Enter the last name as it appears on the ID.',focus:1})}
    ${field('Date of birth','12/04/1990',{req:1,tail:ic('cal')})}
    <div class="f"><label class="req">Gender</label><div class="opts">${rb('Female',1)}${rb('Male')}${rb('Other')}</div></div>
    ${field('Nationality','Indian',{req:1,sel:1})}
    <div class="actions" style="margin-top:8px"><span class="btn">Save draft</span><div class="grow"></div><span class="btn pri">Next ${ic('chev')}</span></div>

document.getElementById('root').innerHTML = (screens[S] || screens.login)()
document.body.dataset.ready = '1'
</script>
</body>
